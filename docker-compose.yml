services:
  math_agent:
    build:
      context: .
      dockerfile: Dockerfile.headless
      args:
        AGENT_NAME: math_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8001
      - AGENT_HOST=math_agent
    ports:
      - "8001:8001"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  lookup_agent:
    build:
      context: .
      dockerfile: Dockerfile.headless
      args:
        AGENT_NAME: lookup_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8002
      - AGENT_HOST=lookup_agent
    ports:
      - "8002:8002"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MATH_AGENT_URL=http://math_agent:8001
      - LOOKUP_AGENT_URL=http://lookup_agent:8002
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=adk_sessions
    ports:
      - "8000:8000"
    networks:
      - a2a-network
    volumes:
      - ./agents:/app/agents
      - ./server.py:/app/server.py
    depends_on:
      postgres:
        condition: service_healthy
      math_agent:
        condition: service_healthy
      lookup_agent:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=adk_sessions
    ports:
      - "5432:5432"
    networks:
      - a2a-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  a2a-network:
    driver: bridge

volumes:
  postgres_data:
