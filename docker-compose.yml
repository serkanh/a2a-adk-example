services:
  math_agent:
    build:
      context: .
      dockerfile: Dockerfile.headless
      args:
        AGENT_NAME: math_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8001
      - AGENT_HOST=math_agent
    ports:
      - "8001:8001"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  lookup_agent:
    build:
      context: .
      dockerfile: Dockerfile.headless
      args:
        AGENT_NAME: lookup_agent
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8002
      - AGENT_HOST=lookup_agent
    ports:
      - "8002:8002"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  strands_agent:
    build:
      context: .
      dockerfile: Dockerfile.strands
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PORT=8004
      - HOST=0.0.0.0
      - AGENT_HOST=strands_agent
      - AWS_PROFILE=${AWS_PROFILE}
      # Headless mode settings for strands tools
      - BYPASS_TOOL_CONSENT=true
      - PYTHON_REPL_INTERACTIVE=false
    volumes:
      - ~/.aws:/root/.aws:ro
    ports:
      - "8004:8004"
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/.well-known/agent-card.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MATH_AGENT_URL=http://math_agent:8001
      - LOOKUP_AGENT_URL=http://lookup_agent:8002
      - STRANDS_AGENT_URL=http://strands_agent:8004
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=adk_sessions
    ports:
      - "8000:8000"
    networks:
      - a2a-network
    volumes:
      - ./agents:/app/agents
      - ./server.py:/app/server.py
    depends_on:
      postgres:
        condition: service_healthy
      math_agent:
        condition: service_healthy
      lookup_agent:
        condition: service_healthy
      strands_agent:
        condition: service_healthy

  adk_api:
    build:
      context: .
      dockerfile: Dockerfile.adk_api
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MATH_AGENT_URL=http://math_agent:8001
      - LOOKUP_AGENT_URL=http://lookup_agent:8002
      - STRANDS_AGENT_URL=http://strands_agent:8004
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=adk_sessions
    ports:
      - "8003:8003"
    networks:
      - a2a-network
    volumes:
      - ./agents:/app/agents
      - ./adk_api.py:/app/adk_api.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/list-apps"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      math_agent:
        condition: service_healthy
      lookup_agent:
        condition: service_healthy
      strands_agent:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=adk_sessions
    ports:
      - "5432:5432"
    networks:
      - a2a-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  a2a-network:
    driver: bridge

volumes:
  postgres_data:
